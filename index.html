<script>
    // Đã thay bằng link thật của Tây Bắc Sài Gòn
    const API_URL = "https://script.google.com/macros/s/AKfycbydvFv9sD16Udwwk6GN4mKUO2_AzdYPPCZCgKzOZYN0XU9_po5WkM7ON6JXlOSEdcNbMQ/exec";

    let uptimeChartInstance = null;
    let ttfbChartInstance = null;
    Chart.defaults.font.family = "'Inter', sans-serif";

    async function fetchData() {
      try {
        let data = null;
        if (!API_URL || API_URL.includes("DÁN_URL_WEB_APP")) {
          data = getMockData();
        } else {
          const res = await fetch(API_URL);
          data = await res.json();
        }
        renderDashboard(data);
      } catch (err) {
        console.error(err);
        renderDashboard(getMockData()); 
      }
    }

    function renderDashboard(data) {
      if (!data || !data.records || data.records.length === 0) return;

      document.getElementById("targetUrlText").innerText = data.targetUrl || "taybacsaigon.com";
      document.getElementById("lastUpdatedText").innerText = "Đã cập nhật lúc " + (data.updatedAt || new Date().toLocaleTimeString("vi-VN"));

      const latest = data.latest || data.records[data.records.length - 1];

      // 1. Logic Uptime (>= 99.9% là Tốt)
      const uVal = parseFloat(latest.uptime);
      document.getElementById("kpiUptime").innerText = uVal;
      if (uVal >= 99.9) {
        document.getElementById("kpiUptime").className = "text-3xl font-bold tracking-tight text-emerald-600";
        document.getElementById("kpiUptimeUnit").className = "text-sm font-semibold text-emerald-600";
        document.getElementById("kpiUptimeSub").innerHTML = '<span class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check text-[10px] mr-1"></i>Hoạt động Tốt</span>';
      } else {
        document.getElementById("kpiUptime").className = "text-3xl font-bold tracking-tight text-rose-600";
        document.getElementById("kpiUptimeUnit").className = "text-sm font-semibold text-rose-600";
        document.getElementById("kpiUptimeSub").innerHTML = '<span class="text-rose-600 font-medium"><i class="fa-solid fa-circle-exclamation text-[10px] mr-1"></i>Không tốt</span>';
      }

      // 2. Logic TTFB (<= 800ms là Tốt)
      const tVal = parseFloat(latest.ttfb);
      document.getElementById("kpiTtfb").innerText = tVal;
      if (tVal <= 800) {
        document.getElementById("kpiTtfb").className = "text-3xl font-bold tracking-tight text-emerald-600";
        document.getElementById("kpiTtfbUnit").className = "text-sm font-semibold text-emerald-600";
        document.getElementById("kpiTtfbSub").innerHTML = '<span class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check text-[10px] mr-1"></i>Tốc độ Tốt</span>';
      } else {
        document.getElementById("kpiTtfb").className = "text-3xl font-bold tracking-tight text-rose-600";
        document.getElementById("kpiTtfbUnit").className = "text-sm font-semibold text-rose-600";
        document.getElementById("kpiTtfbSub").innerHTML = '<span class="text-rose-600 font-medium"><i class="fa-solid fa-arrow-trend-up text-[10px] mr-1"></i>Phản hồi chậm</span>';
      }

      // 3. Logic SSL (> 15 ngày là Tốt)
      const sVal = parseInt(latest.sslDays);
      document.getElementById("kpiSsl").innerText = sVal;
      if (sVal > 15) {
        document.getElementById("kpiSsl").className = "text-3xl font-bold tracking-tight text-emerald-600";
        document.getElementById("kpiSslUnit").className = "text-sm font-semibold text-emerald-600";
        document.getElementById("kpiSslSub").innerHTML = '<span class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check text-[10px] mr-1"></i>An toàn</span>';
      } else {
        document.getElementById("kpiSsl").className = "text-3xl font-bold tracking-tight text-rose-600";
        document.getElementById("kpiSslUnit").className = "text-sm font-semibold text-rose-600";
        document.getElementById("kpiSslSub").innerHTML = '<span class="text-rose-600 font-medium"><i class="fa-solid fa-clock text-[10px] mr-1"></i>Sắp hết hạn</span>';
      }

      // Grouped Status KPIs
      const isConvOk = latest.formTest === "OK" && latest.callTest === "OK";
      const isSecOk = latest.security === "OK" && latest.backup === "OK";
      const isSeoOk = latest.sitemap === "OK" && latest.robots === "OK";

      document.getElementById("kpiConversion").innerHTML = isConvOk ? `<span class="text-emerald-600"><i class="fa-solid fa-check"></i> Đạt</span>` : `<span class="text-rose-600"><i class="fa-solid fa-xmark"></i> Lỗi</span>`;
      document.getElementById("kpiSecurity").innerHTML = isSecOk ? `<span class="text-emerald-600"><i class="fa-solid fa-check"></i> An toàn</span>` : `<span class="text-rose-600"><i class="fa-solid fa-xmark"></i> Lỗi</span>`;
      document.getElementById("kpiSeo").innerHTML = isSeoOk ? `<span class="text-emerald-600"><i class="fa-solid fa-check"></i> Ổn định</span>` : `<span class="text-rose-600"><i class="fa-solid fa-xmark"></i> Lỗi</span>`;

      // Render Charts & Table
      renderCharts(data.records);
      renderTable(data.records);
    }

    function renderCharts(records) {
      const labels = records.map(r => r.date);
      const uptimeData = records.map(r => r.uptime);
      const ttfbData = records.map(r => r.ttfb);

      const ctxUptime = document.getElementById('uptimeChart').getContext('2d');
      if (uptimeChartInstance) uptimeChartInstance.destroy();
      uptimeChartInstance = new Chart(ctxUptime, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: uptimeData, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.05)',
            borderWidth: 2, pointRadius: 3, fill: true, tension: 0.4
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } } } }
      });

      const ctxTtfb = document.getElementById('ttfbChart').getContext('2d');
      if (ttfbChartInstance) ttfbChartInstance.destroy();
      ttfbChartInstance = new Chart(ctxTtfb, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: ttfbData, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.05)',
            borderWidth: 2, pointRadius: 3, fill: true, tension: 0.4
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } } } }
      });
    }

    function renderTable(records) {
      const tbody = document.getElementById("historyTableBody");
      tbody.innerHTML = "";
      const reversed = [...records].reverse();

      reversed.forEach(r => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="py-4 px-5 text-slate-900 font-medium">${r.date}</td>
          <td class="py-4 px-5 font-semibold ${r.uptime < 99.9 ? 'text-rose-600' : 'text-slate-900'}">${r.uptime}%</td>
          <td class="py-4 px-5 text-slate-600">${r.ttfb} <span class="text-xs">ms</span></td>
          <td class="py-4 px-5 text-slate-600">${r.sslDays} <span class="text-xs">ngày</span></td>
          <td class="py-4 px-5 text-center"><div class="flex items-center justify-center gap-1.5">${getDot(r.formTest, "Form")} ${getDot(r.callTest, "Call")}</div></td>
          <td class="py-4 px-5 text-center"><div class="flex items-center justify-center gap-1.5">${getDot(r.sitemap, "Sitemap")} ${getDot(r.robots, "Robots")}</div></td>
          <td class="py-4 px-5 text-center"><div class="flex items-center justify-center gap-1.5">${getDot(r.backup, "Backup")} ${getDot(r.security, "Bảo mật")}</div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function getDot(status, tooltip) {
      const s = String(status || "").toUpperCase();
      if (s === "OK" || s === "PASS") return `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-50" title="${tooltip}: Tốt"></div>`;
      if (s === "FAIL" || s === "ERROR") return `<div class="w-2.5 h-2.5 rounded-full bg-rose-500 ring-4 ring-rose-50" title="${tooltip}: Lỗi"></div>`;
      return `<div class="w-2.5 h-2.5 rounded-full bg-slate-300 ring-4 ring-slate-50"></div>`;
    }

    window.onload = fetchData;
  </script>
