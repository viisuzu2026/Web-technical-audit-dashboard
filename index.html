<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÂY BẮC SÀI GÒN - BẢNG ĐIỀU KHIỂN SỨC KHỎE WEBSITE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Montserrat', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased">

  <!-- HEADER -->
  <header class="relative bg-gradient-to-r from-red-950 via-red-900 to-red-950 py-6 sm:py-8 shadow-xl overflow-hidden border-b-4 border-yellow-500">
    <div class="absolute top-[-50%] left-1/4 w-96 h-96 bg-red-500 rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none"></div>
    <div class="relative max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5">
        <div class="bg-white p-2.5 rounded-xl shadow-[0_8px_20px_rgba(0,0,0,0.3)] border border-white/20 shrink-0 transform transition duration-500 hover:scale-105">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiYyJ5iX0-1fGJwFekfO0b_CuTjVe2jHVsSVCqyRp0pJIwSqfyer964qAL&s=10" alt="Logo" class="h-12 w-auto object-contain">
        </div>
        <div class="flex flex-col justify-center">
          <div class="mb-1 flex items-center gap-2">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-sm text-[10px] font-extrabold uppercase tracking-widest bg-red-950/80 text-yellow-400 border border-yellow-500/30">
              <i class="fa-solid fa-shield-halved mr-1.5 text-yellow-500"></i> ISUZU TÂY BẮC SÀI GÒN
            </span>
          </div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white uppercase drop-shadow-md leading-tight mt-1">
            System Health <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">Dashboard</span>
          </h1>
          <div class="flex items-center gap-2 text-sm text-red-100 mt-1 font-medium" id="targetUrlText">
            <i class="fa-solid fa-link text-xs opacity-70"></i> Mục tiêu: Đang tải...
          </div>
        </div>
      </div>

      <div class="flex flex-col items-start md:items-end shrink-0 w-full md:w-auto">
        <div id="lastUpdatedText" class="text-xs text-red-200 font-medium mb-3 flex items-center gap-1.5 bg-red-950/40 px-3 py-1.5 rounded border border-red-800 shadow-inner">
          <i class="fa-regular fa-clock text-yellow-400"></i> Cập nhật: --
        </div>
        <button onclick="fetchData()" class="group relative inline-flex items-center justify-center gap-2 px-6 py-2.5 text-sm font-bold text-red-950 bg-gradient-to-b from-yellow-300 to-yellow-500 rounded shadow-[0_4px_15px_rgba(234,179,8,0.25)] hover:from-yellow-400 hover:to-yellow-600 transition-all duration-300 transform hover:-translate-y-0.5 border border-yellow-200 uppercase tracking-wide">
          <i class="fa-solid fa-rotate-right group-hover:rotate-180 transition-transform duration-500"></i> Đồng bộ ngay
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Ô NHẬN XÉT TỰ ĐỘNG -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hidden" id="reviewContainer">
      <div class="px-5 py-3 border-b border-slate-200 bg-slate-50 flex items-center gap-2">
        <i class="fa-solid fa-user-doctor text-red-700"></i>
        <h2 class="text-sm font-
